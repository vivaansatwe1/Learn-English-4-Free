<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LingoUSA - Learn English</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght=400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="duo-nav">
    <div class="nav-container">
      <span class="logo">LingoUSA 🇺🇸</span>
    </div>
  </nav>

  <main class="app-container">
    
    <section id="age-screen" class="dashboard-section">
      <h2 class="section-title">Choose your learning path:</h2>
      <div class="age-list">
        <button class="path-card" onclick="selectAge('5-10')">
          <span class="path-emoji">🧸</span>
          <div class="path-info">
            <h3>Ages 5 - 10</h3>
            <p>Fun, elementary vocabulary & basic sentence structures.</p>
          </div>
        </button>
        <button class="path-card" onclick="selectAge('11-13')">
          <span class="path-emoji">🎒</span>
          <div class="path-info">
            <h3>Ages 11 - 13</h3>
            <p>School life, intermediate idioms, and context clues.</p>
          </div>
        </button>
        <button class="path-card" onclick="selectAge('14-16')">
          <span class="path-emoji">🛹</span>
          <div class="path-info">
            <h3>Ages 14 - 16</h3>
            <p>High school navigation, casual slang, and social dynamics.</p>
          </div>
        </button>
        <button class="path-card" onclick="selectAge('17-19')">
          <span class="path-emoji">🎓</span>
          <div class="path-info">
            <h3>Ages 17 - 19</h3>
            <p>Higher education, banking, and academic transitions.</p>
          </div>
        </button>
        <button class="path-card" onclick="selectAge('20-30')">
          <span class="path-emoji">💼</span>
          <div class="path-info">
            <h3>Ages 20 - 30</h3>
            <p>Career networking, professional communication, and interviews.</p>
          </div>
        </button>
        <button class="path-card" onclick="selectAge('30+')">
          <span class="path-emoji">🌟</span>
          <div class="path-info">
            <h3>Ages 30+</h3>
            <p>Civic life, community integration, and navigating US systems.</p>
          </div>
        </button>
      </div>
    </section>

    <section id="platform-screen" class="dashboard-section hidden">
      <div class="track-header">
        <button class="exit-btn" onclick="exitPlatform()">✖ Leave</button>
        <div class="progress-bar-container">
          <div id="progress-fill" class="progress-fill" style="width: 10%"></div>
        </div>
        <span id="story-tracker" class="tracker-text">Story 1 of 10</span>
      </div>

      <div class="interactive-grid">
        <div class="content-panel">
          <div class="panel-tag" id="level-badge">AGES 5-10</div>
          <h2 id="story-title" class="story-title">Story Loading...</h2>
          <div class="hint-alert">💡 Tap the <strong>blue underlined</strong> words to hear pronunciation, definition, and origin!</div>
          <div id="story-body" class="story-passage"></div>
        </div>

        <div class="quiz-panel">
          <h3 class="quiz-heading">Check your understanding:</h3>
          <p id="quiz-prompt" class="quiz-prompt">Question loading...</p>
          <div id="quiz-options" class="options-stack"></div>
        </div>
      </div>

      <footer class="action-footer">
        <p id="feedback-bar" class="feedback-text hidden"></p>
        <button id="action-btn" class="verify-btn" onclick="evaluateAnswer()" disabled>Check Answer</button>
      </footer>
    </section>
  </main>

  <div id="dict-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-word">Word</h3>
        <button class="audio-trigger-btn" onclick="speakCurrentWord()">🔊 Listen</button>
      </div>
      <div class="modal-body">
        <p><strong>Definition:</strong> <span id="modal-def">...</span></p>
        <p class="origin-row"><strong>Origin:</strong> <span id="modal-origin">...</span></p>
      </div>
      <button class="close-modal-btn" onclick="closeModal()">Got It</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
