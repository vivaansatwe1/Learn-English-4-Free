<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US English Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app-container">
    <header class="header">
      <h1>US English Academy 🇺🇸</h1>
      <p class="subtitle">Learn English through stories and fun quizzes!</p>
    </header>

    <section id="age-screen" class="section">
      <h3>Select Your Age Group to Start:</h3>
      <div class="age-grid">
        <button class="age-btn" onclick="selectAge('5-10')">Ages 5 - 10 🧸</button>
        <button class="age-btn" onclick="selectAge('11-13')">Ages 11 - 13 🎒</button>
        <button class="age-btn" onclick="selectAge('14-16')">Ages 14 - 16 🛹</button>
        <button class="age-btn" onclick="selectAge('17-19')">Ages 17 - 19 🎓</button>
        <button class="age-btn" onclick="selectAge('20-30')">Ages 20 - 30 💼</button>
        <button class="age-btn" onclick="selectAge('30+')">Ages 30+ 🌟</button>
      </div>
    </section>

    <section id="lesson-screen" class="section hidden">
      <button class="back-btn" onclick="goBack()">⬅️ Change Age Group</button>
      
      <div class="lesson-card">
        <span class="badge" id="age-badge">Ages 5-10</span>
        <h2 id="lesson-title">Loading Lesson...</h2>
        
        <div class="story-box">
          <p id="lesson-story">Loading story...</p>
        </div>
      </div>

      <div class="quiz-card">
        <h3>Practice Question:</h3>
        <p id="quiz-question">Loading question...</p>
        <div id="quiz-options" class="options-container"></div>
        <p id="feedback" class="feedback hidden"></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
