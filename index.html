<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn English for the US</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app-container">
    <header class="header">
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">🌙</button>
      <h1>Welcome to the US! 🇺🇸</h1>
      <p class="subtitle">Learn everyday English phrases easily.</p>
    </header>

    <section class="flashcard-section">
      <div class="card" id="flashcard">
        <div class="card-inner">
          <div class="card-front">
            <p class="category">Greeting</p>
            <h2 id="english-phrase">"How's it going?"</h2>
            <span class="tap-hint">Tap to see meaning</span>
          </div>
          <div class="card-back">
            <p class="category">Meaning</p>
            <h2 id="translation">"How are you doing?" / "How is your day?"</h2>
            <span class="tap-hint">Tap to go back</span>
          </div>
        </div>
      </div>
      <button id="next-btn" class="action-btn">Next Phrase ➡️</button>
    </section>

    <section class="quiz-section">
      <h3>Quick Practice Quiz</h3>
      <p id="quiz-question">What does "Where is the checkout line?" mean?</p>
      <div class="quiz-options">
        <button class="quiz-option" onclick="checkAnswer(false)">Where is the bus stop?</button>
        <button class="quiz-option" onclick="checkAnswer(true)">Where do I pay for my items?</button>
        <button class="quiz-option" onclick="checkAnswer(false)">Where is the restroom?</button>
      </div>
      <p id="quiz-feedback" class="feedback hidden"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
